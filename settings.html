<!DOCTYPE html>

<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>设置</title>


<style>

body{

font-family:
-apple-system,BlinkMacSystemFont,"PingFang SC";

background:#fff5f8;

padding:20px;

}


.box{

background:white;

padding:20px;

border-radius:20px;

}


input{

width:100%;

padding:12px;

margin:10px 0;

border-radius:10px;

border:1px solid #ddd;

}


button{

padding:12px 20px;

border:none;

border-radius:20px;

background:#ff8fab;

color:white;

}


.dark{

background:#222;

color:white;

}

</style>

</head>


<body>


<div class="box">


<h1>⚙️ 设置</h1>


<label>

网站名称

</label>


<input id="siteName">


<label>

作品API地址

</label>


<input id="api">


<label>

主题

</label>


<select id="theme">

<option value="light">

浅色

</option>


<option value="dark">

深色

</option>

</select>


<br><br>


<button onclick="save()">

保存

</button>


</div>



<script>


siteName.value=
localStorage.siteName || 
"CP Collection";


api.value=
localStorage.api || "";



function save(){


localStorage.siteName=
siteName.value;


localStorage.api=
api.value;



if(theme.value==="dark"){

document.body.className="dark";

}

alert("保存成功");


}


</script>


</body>

</html>
