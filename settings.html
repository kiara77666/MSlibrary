<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>
MS Library 设置
</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<header>

<h1>⚙️ 网站设置</h1>

</header>



<main>


<div class="card">


<h2>主题设置</h2>


<h2>
页面颜色
</h2>


<button onclick="changeTheme('black')">
黑色
</button>


<button onclick="changeTheme('white')">
白色
</button>


<button onclick="changeTheme('pink')">
粉色
</button>


<button onclick="changeTheme('green')">
绿色
</button>


<button onclick="changeTheme('yellow')">
黄色
</button>



<hr>



<h2>API 配置</h2>


<p>
当前 API 状态：
<span id="apiStatus">
检测中...
</span>
</p>



<label>
Supabase URL
</label>


<input
id="apiUrl"
placeholder="输入 API 地址">



<label>
Anon Key
</label>


<input
id="apiKey"
placeholder="输入 API Key">



<button onclick="saveAPI()">

保存 API

</button>



<hr>



<h2>
网站信息
</h2>


<input
id="siteName"
placeholder="网站名称">


<button onclick="saveSite()">

保存网站名称

</button>



</div>


</main>



<script src="settings.js"></script>


</body>

</html>
