<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>
MS Library 后台
</title>


<link rel="stylesheet" href="style.css">


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>


</head>



<body>


<header>

<h1>
📚 管理后台
</h1>

</header>



<main>


<div class="card">


<h2>
添加作品
</h2>



<input id="title"
placeholder="作品名称">



<select id="cp">

<option>敏沙</option>

<option>眉嘉</option>

<option>朝允</option>

<option>其他角色拉郎</option>

</select>



<select id="type">

<option>同人文</option>

<option>CP视频</option>

</select>




<input id="url"
placeholder="跳转链接">



<input id="tags"
placeholder="标签">



<textarea
id="description"
placeholder="简介">
</textarea>



<input
type="file"
id="cover">



<button onclick="saveWork()">

保存作品

</button>



<hr>



<h2>
作品管理
</h2>



<div id="workList">

加载中...

</div>



</div>


</main>



<script>

client.auth.getSession()

.then(({data})=>{

if(!data.session){

location.href="login.html";

}

});


</script>



<script src="admin.js"></script>



</body>

</html>
