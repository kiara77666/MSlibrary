<!DOCTYPE html>

<html lang="zh-CN">

<head>

<meta charset="UTF-8">


<meta name="viewport"
content="width=device-width,initial-scale=1.0">


<title>
MS Library 后台
</title>



<link rel="stylesheet" href="style.css">


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script src="supabase.js"></script>


</head>




<body>


<header>


<h1>
📚 MS Library
</h1>



<div class="top-tools">


<button onclick="openNotice()">
使用须知
</button>


<button onclick="openMessage()">
留言板
</button>


</div>




<input id="search"
placeholder="搜索作品、CP...">


</header>



  

<main>


<div class="card">


  <div class="admin-menu">

<button onclick="showWorks()">
作品管理
</button>


<button onclick="showMessages()">
留言管理
</button>

  </div>


<h2>
添加作品
</h2>




<!-- 标题 -->

<input

id="title"

placeholder="作品名称">





<!-- CP -->


<select id="cp">


<option>
敏沙
</option>


<option>
眉嘉
</option>


<option>
朝允
</option>


<option>
其他角色拉郎
</option>


</select>






<!-- 作品分类 -->


<select id="type">


<option>
同人文
</option>


<option>
视频
</option>


<option>
图文
</option>


<option>
剪辑
</option>


<option>
其他
</option>


</select>







<!-- 首字母 -->


<input

id="letter"

placeholder="首字母，例如 M">






<!-- 链接 -->


<input

id="url"

placeholder="作品跳转链接">







<!-- TAG -->


<input

id="tags"

placeholder="
Tag，例如：
港风,现背,伪现背,破镜重圆,HE
">







<!-- 简介 -->


<textarea

id="description"

placeholder="作品简介">

</textarea>






<button onclick="saveWork()">

保存作品

</button>






<hr>







<h2>
作品管理
</h2>


<div id="workList">

加载中...

</div>



<hr>



<h2>
留言管理
</h2>


<div id="messageAdminList">

加载中...

</div>




  
</div>



</main>






<script>


client.auth.getSession()

.then(({data})=>{


if(!data.session){


location.href="login.html";


}



});


</script>


<!-- 使用须知 -->


<div id="noticeBox"
class="popup">


<div class="popup-content">


<h2>
使用须知
</h2>


<p>
1.本网站无任何盈利，所有收纳在内的同人文，二创剪辑，花絮与领磕帖均为跳转式，请支持为敏沙发电的各位老师，用点赞，评论或关注让老师们感受到爱。
</p>



<p>
2.允许转发，禁止以各种方式售卖或有偿交换的形式利用本网站进行盈利。若有发现，必追究责任。
</p>



<p>
3.招募网站后台管理者，无报酬，纯为爱发电，详情请私信微博@江之岛不会告诉你。
</p>



<p>
4.特此感谢@懒懒的咸鱼fish，@不定食_，@咪圆小Ruii_。
</p>



<div class="thanks">

感谢世界上有爱<br>
/江之岛不会告诉你

</div>



<button onclick="closeNotice()">
关闭
</button>


</div>

</div>





<!-- 留言 -->


<div id="messageBox"
class="popup">


<div class="popup-content">


<h2>
留言板
</h2>



<input id="messageName"
placeholder="署名">


<textarea
id="messageContent"
placeholder="留下你的建议">
</textarea>




<button onclick="sendMessage()">
提交留言
</button>



<div id="messageList">

</div>



<button onclick="closeMessage()">
关闭
</button>


</div>

</div>


<script src="admin.js"></script>



</body>



</html>
